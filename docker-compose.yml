services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: algoshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migrations:/docker-entrypoint-initdb.d
    ports:
      - 5432:5432
    networks:
      - algoshield-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: ${HEALTHCHECK_INTERVAL_POSTGRES:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT_POSTGRES:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}
      start_period: ${HEALTHCHECK_START_PERIOD_POSTGRES:-10s}
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=4MB
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB

  # =============================================================================
  # Redis (Unified - DB0 for cache, DB1 for Asynq queue)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: algoshield-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --databases 16
    volumes:
      - redis_data:/data
    ports:
      - 6379:6379
    networks:
      - algoshield-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${HEALTHCHECK_INTERVAL_REDIS:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT_REDIS:-3s}
      retries: ${HEALTHCHECK_RETRIES:-5}
      start_period: ${HEALTHCHECK_START_PERIOD_REDIS:-5s}
    security_opt:
      - no-new-privileges:true

  # =============================================================================
  # Asynqmon Web UI (Task Queue Monitoring)
  # =============================================================================
  asynqmon:
    image: hibiken/asynqmon:latest
    platform: linux/amd64
    container_name: algoshield-asynqmon
    restart: unless-stopped
    ports:
      - 8081:8080
    environment:
      REDIS_ADDR: redis:6379
      REDIS_DB: 1
      ENABLE_METRICS_EXPORTER: "true"
      PROMETHEUS_ADDR: ":9090"
    networks:
      - algoshield-network
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # =============================================================================
  # API Service
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: algoshield-api
    restart: unless-stopped
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Redis (DB0 for cache)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Redis Queue (Asynq - DB1 for queue)
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PORT: 6379
      REDIS_QUEUE_DB: 1
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8080
      TLS_ENABLE: ${TLS_ENABLE}
      TLS_CERT_PATH: ${TLS_CERT_PATH}
      TLS_KEY_PATH: ${TLS_KEY_PATH}
      # General
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
    ports:
      - 8080:8080
    networks:
      - algoshield-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: ${HEALTHCHECK_INTERVAL_API:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT_API:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD_API:-15s}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # =============================================================================
  # Worker Service
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: algoshield-worker
    restart: unless-stopped
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Redis (DB0 for cache)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Redis Queue (Asynq - DB1 for queue)
      REDIS_QUEUE_HOST: redis
      REDIS_QUEUE_PORT: 6379
      REDIS_QUEUE_DB: 1
      # Asynq Configuration
      ASYNQ_CONCURRENCY: ${ASYNQ_CONCURRENCY:-10}
      ASYNQ_MAX_RETRY: ${ASYNQ_MAX_RETRY:-3}
      ASYNQ_QUEUE_CRITICAL_WEIGHT: ${ASYNQ_QUEUE_CRITICAL_WEIGHT:-6}
      ASYNQ_QUEUE_DEFAULT_WEIGHT: ${ASYNQ_QUEUE_DEFAULT_WEIGHT:-3}
      ASYNQ_QUEUE_LOW_WEIGHT: ${ASYNQ_QUEUE_LOW_WEIGHT:-1}
      ASYNQ_TIMEOUT_TRANSACTION: ${ASYNQ_TIMEOUT_TRANSACTION:-5m}
      ASYNQ_RETENTION_COMPLETED: ${ASYNQ_RETENTION_COMPLETED:-24h}
      ASYNQ_RETENTION_FAILED: ${ASYNQ_RETENTION_FAILED:-7d}
      # Worker (legacy - keeping for backward compatibility during migration)
      WORKER_TIMEOUT_RULE_EVALUATION: ${WORKER_TIMEOUT_RULE_EVALUATION:-300ms}
      WORKER_RULES_RELOAD_INTERVAL: ${WORKER_RULES_RELOAD_INTERVAL:-10s}
      # General
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}
      # Auth (for database access)
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - algoshield-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q /worker || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL_WORKER:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT_WORKER:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD_WORKER:-10s}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # =============================================================================
  # UI Service (Vue.js)
  # =============================================================================
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: algoshield-ui
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Service identification
      VITE_SERVICE_NAME: ${VITE_SERVICE_NAME}
      # API URL for direct CORS communication (must be accessible from browser)
      VITE_API_URL: ${VITE_API_URL}
      VITE_API_TIMEOUT: ${VITE_API_TIMEOUT}
      VITE_API_RETRY_MAX_ATTEMPTS: ${VITE_API_RETRY_MAX_ATTEMPTS}
      VITE_API_RETRY_INITIAL_DELAY: ${VITE_API_RETRY_INITIAL_DELAY}
      VITE_API_RETRY_MAX_DELAY: ${VITE_API_RETRY_MAX_DELAY}
      VITE_API_RETRY_MULTIPLIER: ${VITE_API_RETRY_MULTIPLIER}
      VITE_UI_TOAST_DURATION: ${VITE_UI_TOAST_DURATION}
      VITE_UI_POLLING_INTERVAL: ${VITE_UI_POLLING_INTERVAL}
    ports:
      - 3000:3000
    networks:
      - algoshield-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: ${HEALTHCHECK_INTERVAL_UI:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT_UI:-10s}
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD_UI:-20s}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

# =============================================================================
# Networks
# =============================================================================
networks:
  algoshield-network:
    driver: bridge
    name: algoshield-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: algoshield-postgres-data
    driver: local
  redis_data:
    name: algoshield-redis-data
    driver: local