name: Backend CI (API + Worker)

on:
  push:
    branches: [main, develop]
    paths:
      - "src/api/**"
      - "src/workers/**"
      - "src/pkg/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.api"
      - "Dockerfile.worker"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/api/**"
      - "src/workers/**"
      - "src/pkg/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.api"
      - "Dockerfile.worker"
      - ".github/workflows/backend.yml"

env:
  GO_VERSION: "1.25.5"
  DOCKER_BUILDKIT: 1
  GOPROXY: https://proxy.golang.org,direct

jobs:
  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ env.GO_VERSION }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
        continue-on-error: false

  test-backend:
    name: Test Backend (API + Worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: algoshield_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        component: ["api", "workers", "pkg"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ env.GO_VERSION }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Download dependencies
        run: go mod download

      - name: Install gotestsum
        run: |
          if ! command -v gotestsum &> /dev/null; then
            go install gotest.tools/gotestsum@latest
          fi

      - name: Run ${{ matrix.component }} tests
        run: |
          gotestsum --format testdox -- -race -parallel 4 -coverprofile=coverage-${{ matrix.component }}.out ./src/${{ matrix.component }}/...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/algoshield_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          GOPROXY: ${{ env.GOPROXY }}

      - name: Upload ${{ matrix.component }} coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage-${{ matrix.component }}.out
          flags: ${{ matrix.component }}
          name: ${{ matrix.component }}-coverage

  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: algoshield-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker Docker Image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: algoshield-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan (Backend)
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        id: gosec
        uses: securego/gosec@master
        with:
          args: "-severity high -confidence medium -fmt json -out gosec-report.json ./src/..."
        continue-on-error: true

      - name: Display Gosec Results (Human Readable)
        if: always()
        run: |
          echo "=========================================="
          echo "🔍 Gosec Security Scanner Results"
          echo "=========================================="
          echo ""

          if [ -f gosec-report.json ]; then
            # Check if jq is available
            if ! command -v jq &> /dev/null; then
              echo "⚠️  jq not found, installing..."
              sudo apt-get update -qq && sudo apt-get install -y jq
            fi

            # Count issues by severity
            TOTAL=$(jq '.Issues | length' gosec-report.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Issues[] | select(.severity == "HIGH")] | length' gosec-report.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Issues[] | select(.severity == "MEDIUM")] | length' gosec-report.json 2>/dev/null || echo "0")
            LOW=$(jq '[.Issues[] | select(.severity == "LOW")] | length' gosec-report.json 2>/dev/null || echo "0")

            echo "📊 Summary:"
            echo "  Total Issues: $TOTAL"
            echo "  🔴 HIGH:      $HIGH"
            echo "  🟡 MEDIUM:    $MEDIUM"
            echo "  🟢 LOW:       $LOW"
            echo ""

            if [ "$TOTAL" -gt 0 ]; then
              echo "=========================================="
              echo "📋 Detailed Issues:"
              echo "=========================================="
              echo ""

              # Display each issue in a readable format
              jq -r '.Issues[] |
                "----------------------------------------\n" +
                "🚨 [\(.severity)] \(.rule_id): \(.details)\n" +
                "📁 File: \(.file):\(.line)\n" +
                "📝 Code: \(.code)\n" +
                "🔗 CWE: \(.cwe.ID // "N/A") - \(.cwe.URL // "N/A")\n"
              ' gosec-report.json

              echo "=========================================="
              echo ""

              # Set exit code based on HIGH severity issues
              if [ "$HIGH" -gt 0 ]; then
                echo "❌ Found $HIGH HIGH severity issue(s). Please review and fix."
                echo "::error::Gosec found $HIGH HIGH severity security issue(s)"
                exit 1
              elif [ "$MEDIUM" -gt 0 ]; then
                echo "⚠️  Found $MEDIUM MEDIUM severity issue(s). Consider fixing."
                echo "::warning::Gosec found $MEDIUM MEDIUM severity security issue(s)"
              else
                echo "✅ No HIGH or MEDIUM severity issues found."
              fi
            else
              echo "✅ No security issues found by Gosec!"
            fi
          else
            echo "⚠️  gosec-report.json not found. Scan may have failed."
            echo "::warning::Gosec report file not generated"
          fi

      - name: Upload Gosec Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-security-report
          path: gosec-report.json
          retention-days: 30

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/golang
        continue-on-error: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
        continue-on-error: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run govulncheck (Go vulnerability scanner)
        run: |
          if ! command -v govulncheck &> /dev/null; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          fi
          govulncheck ./src/...
        continue-on-error: false
